name: FG Mask 320 UltraDirect Windows x64
on:
  push:
    branches: [fg-320-ultradirect]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile x64 with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC not found' }
          $dev = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $line = 'call "' + $dev + '" && call Build.cmd'
          & cmd.exe /d /c $line
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          if (!(Test-Path 'bin/FG.exe')) { throw 'FG.exe missing' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item bin/FG.exe,README.md package/
          Get-Item package/FG.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: FG-320-UltraDirect-Windows-x64
          path: package/
          if-no-files-found: error
