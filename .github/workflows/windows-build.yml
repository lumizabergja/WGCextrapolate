name: Build WGC Extrapolate v3 Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct SHA-verified v3 C++ source and NVIDIA headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python reconstruct.py
          if ($LASTEXITCODE -ne 0) { throw 'WGC source integrity reconstruction failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Download-Headers.ps1
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA headers failed to download' }
      - name: Build MSVC executable and package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'MSVC vswhere missing' }
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (!$vs) { throw 'MSVC x64 missing' }
          $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build-And-Pack.cmd > build.log 2>&1')
          $status = $LASTEXITCODE
          if (Test-Path build.log) { Get-Content build.log }
          if ($status -ne 0) { throw "Build failed ($status)" }
          if (!(Test-Path 'artifacts/FG-WGC-D3D11-LowLatency-Windows-x64.zip')) { throw 'ZIP not produced' }
      - name: Upload ZIP and build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WGC-extrapolate-v3-Windows-x64
          path: |
            artifacts/*.zip
            build.log
          if-no-files-found: warn
