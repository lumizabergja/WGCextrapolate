name: Build V15 Clean V16 - Looking Glass DXGI
on:
  push:
    branches: [v15clean-v16-lookingglass-dxgi-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout V15 DXGI source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify untouched V15 Clean V16 plus DXGI fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check brotli==1.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          python prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'V15 original source reconstruction failed' }
          python patch_freeze.py
          if ($LASTEXITCODE -ne 0) { throw 'DXGI exclusion / freeze patch failed' }
          $sha = (Get-FileHash src/main.cpp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'a33b0dcc3dfa42461433bdadf4528b59387c44f434396f8228d45a954404c3c2') {
            throw "Patched source checksum mismatch: $sha"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Download-Headers.ps1
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA Optical Flow headers failed to download' }
      - name: Build Windows x64 app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Microsoft Visual C++ tools unavailable' }
          $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build.cmd > build.log 2>&1')
          $exit = $LASTEXITCODE
          if (Test-Path build.log) { Get-Content build.log }
          if ($exit -ne 0) { throw "MSVC build failed: $exit" }
          if (!(Test-Path bin/FG-LG-DXGI-FreezeFix.exe)) { throw 'Compiled EXE missing' }
      - name: Package ready-to-run and full buildable source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path 'bin/FG-LG-DXGI-FreezeFix.exe','README.md','CAPTURE-NOTES.md' -DestinationPath 'artifacts/FG-V15CleanV16-LookingGlass-DXGI-Windows-x64.zip' -Force
          Compress-Archive -Path 'src','Build.cmd','Download-Headers.ps1','prepare_source.py','patch_freeze.py','README.md','CAPTURE-NOTES.md' -DestinationPath 'artifacts/FG-V15CleanV16-LookingGlass-DXGI-Source.zip' -Force
          Get-ChildItem artifacts/*.zip | Select-Object Name, Length
      - name: Upload Windows x64 and source ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: FG-V15CleanV16-LookingGlass-DXGI-ZIPs
          path: artifacts/*.zip
          if-no-files-found: error
      - name: Upload build log if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSVC-build-log
          path: build.log
          if-no-files-found: ignore
