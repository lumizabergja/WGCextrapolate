name: FG WGC 320 Native D3D12 Frame Warp
on:
  workflow_dispatch:
  push:
    branches: ['fg-wgc-320-26h2-native12-warp']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with MSVC x64
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          echo Windows SDK: %WindowsSDKVersion%
          call Build.cmd
          if errorlevel 1 exit /b 1
          if not exist bin\FG.exe exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: FG-WGC-320-26H2-Native12-Warp-Windows-x64
          path: |
            bin/FG.exe
            README.md
          if-no-files-found: error
