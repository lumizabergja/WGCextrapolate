name: FG native DX11 NGX probe
on:
  workflow_dispatch:
  push:
    branches: ['fg-dx11-ngx-latewarp-probe']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call Build-Probe.cmd
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: FG-NGX-DX11-Probe
          path: |
            bin/FG-NGX-DX11-Probe.exe
            Test.cmd
            PROBE.md
          if-no-files-found: error
