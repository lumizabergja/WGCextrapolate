version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
clone_depth: 1
branches:
  only:
    - v15-nvfbc-driver-probe-20261122
install:
  - ps: |
      $ErrorActionPreference='Stop'
      New-Item -ItemType Directory -Force vendor/headers | Out-Null
      Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/joelngwt/CloudyNvCapture/master/inc/NvFBC/nvFBC.h' -OutFile 'vendor/headers/nvFBC.h'
      if((Get-Item vendor/headers/nvFBC.h).Length -lt 1024){throw 'Legacy NvFBC header missing'}
build_script:
  - ps: |
      $ErrorActionPreference='Stop'
      $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if(!$vs){throw 'MSVC x64 unavailable'}
      $vcvars=Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && if not exist bin mkdir bin && cl /nologo /std:c++20 /utf-8 /O2 /MT /EHsc /W4 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0A00 /I "vendor\headers" src\NvFBC-Diag.cpp /Fe:bin\NVFBC-Diagnostic.exe /link /SUBSYSTEM:CONSOLE advapi32.lib > build.log 2>&1')
      $ec=$LASTEXITCODE
      if(Test-Path build.log){Get-Content build.log}
      if($ec -ne 0){throw "NVFBC diagnostic compilation failed (exit $ec)"}
      if(!(Test-Path bin/NVFBC-Diagnostic.exe)){throw 'EXE missing'}
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path bin/NVFBC-Diagnostic.exe,README-NVFBC-Diagnostic.md -DestinationPath artifacts/NVFBC-Driver-Diagnostic-Windows-x64.zip -Force
artifacts:
  - path: artifacts/NVFBC-Driver-Diagnostic-Windows-x64.zip
    name: NVFBC-Driver-Diagnostic-Windows-x64
  - path: build.log
    name: MSVC-build-log
test: off
