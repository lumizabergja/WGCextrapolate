version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
clone_depth: 1
branches:
  only:
    - lookingglass-capture-start-stop
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      python prepare_source.py
      if ($LASTEXITCODE -ne 0) { throw 'Capture-only C++ source reconstruction failed' }
build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if (!$vs) { throw 'MSVC x64 toolchain unavailable' }
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      if (!(Test-Path $vcvars)) { throw 'vcvars64.bat missing' }
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build.cmd > build.log 2>&1')
      $code = $LASTEXITCODE
      if (Test-Path build.log) { Get-Content build.log }
      if ($code -ne 0) { throw "C++ build failed ($code)" }
      if (!(Test-Path 'bin/FG-LG-StartStop.exe')) { throw 'Capture EXE missing' }
      New-Item -ItemType Directory -Force 'artifacts' | Out-Null
      Compress-Archive -Path 'bin/FG-LG-StartStop.exe', 'README.md' -DestinationPath 'artifacts/FG-LookingGlass-StartStop-Windows-x64.zip' -Force
artifacts:
  - path: artifacts/FG-LookingGlass-StartStop-Windows-x64.zip
    name: FG-LookingGlass-StartStop-Windows-x64
  - path: build.log
    name: MSVC-build-log
test: off
