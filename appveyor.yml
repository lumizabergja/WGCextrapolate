version: '35.extrap.{build}'
image: Visual Studio 2022
platform: x64
configuration: Release
clone_depth: 1

branches:
  only:
    - v35-dxgi-wgc-extrapolation-reflex

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'ci/build-appveyor.ps1'
      if ($LASTEXITCODE -ne 0) { throw "Extrapolation MSVC compilation failed ($LASTEXITCODE)" }

artifacts:
  - path: artifacts\FG-V35-Extrapolation-Reflex-Windows-x64.zip
    name: FG-V35-Extrapolation-Reflex-Windows-x64

test: off
deploy: off
