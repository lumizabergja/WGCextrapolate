version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
# Do not use shallow clone: queued builds can reference a prior SHA.
install:
  - ps: |
      $ErrorActionPreference='Stop'
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Download-Headers.ps1
      if($LASTEXITCODE -ne 0){throw 'Header download failed'}
build_script:
  - ps: |
      $ErrorActionPreference='Stop'
      $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if(-not $vs){throw 'MSVC compiler not installed'}
      $vcvars=Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "'+$vcvars+'" && call build.cmd > build.log 2>&1')
      $exit=$LASTEXITCODE
      if(Test-Path build.log){Get-Content build.log}
      if($exit -ne 0){throw "C++ compilation failed ($exit)"}
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path 'bin\WGC-NvOFA-Fresh.exe','README.md' -DestinationPath 'artifacts\WGC-NvOFA-Fresh-Windows-x64.zip' -Force
      if(-not (Test-Path 'artifacts\WGC-NvOFA-Fresh-Windows-x64.zip')){throw 'Missing ZIP artifact'}
artifacts:
  - path: artifacts\WGC-NvOFA-Fresh-Windows-x64.zip
    name: Ready-to-run Windows x64 ZIP
  - path: build.log
    name: Compiler log
test: off
