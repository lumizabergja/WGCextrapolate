version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
clone_depth: 1
branches:
  only:
    - v15-dxgi-v35-exact-pacing-20261122

install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      python prepare_v15_pacing.py
      if ($LASTEXITCODE -ne 0) { throw 'V15 source reconstruction failed' }
      python apply_v35_exact.py
      if ($LASTEXITCODE -ne 0) { throw 'V35 scheduler patch failed' }

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if (!$vs) { throw 'MSVC x64 build tools missing' }
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build.cmd > build.log 2>&1')
      $ec = $LASTEXITCODE
      if (Test-Path build.log) { Get-Content build.log }
      if ($ec -ne 0) { throw "Compilation failed ($ec)" }
      if (!(Test-Path 'bin/FG.exe')) { throw 'Missing executable' }
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path bin/FG.exe,README.md -DestinationPath artifacts/FG-V15-DXGI-V35-ExactPacing-Windows-x64.zip -Force

artifacts:
  - path: artifacts/FG-V15-DXGI-V35-ExactPacing-Windows-x64.zip
    name: FG-V15-DXGI-V35-ExactPacing-Windows-x64
  - path: build.log
    name: MSVC build log
test: off
