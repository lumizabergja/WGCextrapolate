version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
clone_depth: 1
branches:
  only:
    - v15-lookingglass-dxgi-v2
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      python -m pip install --disable-pip-version-check brotli==1.1.0
      if ($LASTEXITCODE -ne 0) { throw 'Python Brotli install failed' }
      python prepare_source.py
      if ($LASTEXITCODE -ne 0) { throw 'Verified V15 Looking Glass source reconstruction failed' }
      python patch_freeze.py
      if ($LASTEXITCODE -ne 0) { throw 'Verified DXGI freeze-fix v2 source patch failed' }
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File Download-Headers.ps1
      if ($LASTEXITCODE -ne 0) { throw 'NVIDIA optical flow header download failed' }

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if (!$vs) { throw 'MSVC x64 unavailable' }
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build.cmd > build.log 2>&1')
      $ec = $LASTEXITCODE
      if (Test-Path 'build.log') { Get-Content 'build.log' }
      if ($ec -ne 0) { throw "Windows C++ compile failed ($ec)" }
      if (!(Test-Path 'bin/FG-LG-DXGI-FreezeFix.exe')) { throw 'Executable missing' }
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path bin/FG-LG-DXGI-FreezeFix.exe,README.md -DestinationPath artifacts/FG-V15-LookingGlass-DXGI-FreezeFix-Windows-x64.zip -Force

artifacts:
  - path: artifacts/FG-V15-LookingGlass-DXGI-FreezeFix-Windows-x64.zip
    name: FG-V15-LookingGlass-DXGI-FreezeFix-Windows-x64
  - path: build.log
    name: MSVC build log
test: off
