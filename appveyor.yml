version: '1.0.{build}'
image: Visual Studio 2022
platform: x64
configuration: Release
branches:
  only:
    - fg-cuda-reflex-boost-clean
clone_depth: 1
install:
  - ps: .\Install-ZeroCopy-CUDA.ps1
build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $env:CUDA_PATH = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v12.8'
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      if (!$vs) { throw 'MSVC missing' }
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && call Build.cmd --blackwell && call Test.cmd')
      if ($LASTEXITCODE -ne 0) { throw "Compilation or CPU tests failed: $LASTEXITCODE" }
      if (!(Test-Path 'bin/FG.exe')) { throw 'Executable missing' }
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path 'bin/FG.exe','README.md' -DestinationPath 'artifacts/FG-Reflex-Boost-Clean-Windows-x64.zip' -Force
      Compress-Archive -Path 'src','tests','vendor','Build.cmd','Test.cmd','README.md','appveyor.yml','Install-ZeroCopy-CUDA.ps1','Fetch-NVAPI.ps1' -DestinationPath 'artifacts/FG-Reflex-Boost-Clean-Source.zip' -Force
test: off
artifacts:
  - path: artifacts\*.zip
