version: 1.0.{build}
image: Visual Studio 2022
platform: x64
configuration: Release
build_script:
  - cmd: call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" && call Build.cmd
after_build:
  - ps: Compress-Archive -Path bin/FG.exe,README.md -DestinationPath FG-320-UltraDirect-Windows-x64.zip -Force
test: off
artifacts:
  - path: FG-320-UltraDirect-Windows-x64.zip
