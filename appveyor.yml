version: '1.0.{build}'
image: Visual Studio 2022
platform: x64
configuration: Release
branches:
  only:
    - fg-dx11-ngx-latewarp-probe
build_script:
  - cmd: |
      call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
      if errorlevel 1 exit /b 1
      call Build-Probe.cmd
      if errorlevel 1 exit /b 1
  - ps: |
      $ErrorActionPreference = 'Stop'
      Compress-Archive -Path 'bin/FG-NGX-DX11-Probe.exe','Test.cmd','PROBE.md' -DestinationPath 'FG-NGX-DX11-Probe.zip' -Force
test: off
artifacts:
  - path: FG-NGX-DX11-Probe.zip
