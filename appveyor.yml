version: '1.0.{build}'
image: Visual Studio 2022
platform: x64
configuration: Release
branches:
  only:
    - fg-v15-v16-cuda-vulkan-reflex
clone_depth: 1
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $zip = Join-Path $pwd 'source.zip'
      [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String((Get-Content -Raw 'cuda-vulkan-source.b64')))
      $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
      if ($hash -ne '0fcb8e92e8840be250074d058aa86f1927126c463834d66c6e14a98576e86d37') { throw 'Source integrity check failed' }
      Expand-Archive -LiteralPath $zip -DestinationPath 'fg' -Force
      if (!(Test-Path 'fg/Build.cmd')) { throw 'Source missing' }
      & .\fg\Install-SDKs.ps1
build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $vswhere = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'
      if (!(Test-Path $vswhere)) { $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe' }
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
      if (!$vs) { throw 'MSVC missing' }
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      Push-Location fg
      try {
        & cmd.exe /d /s /c ('call "' + $vcvars + '" && call ci-env.cmd && call Build.cmd && cl /nologo /std:c++20 /EHsc /O2 tests\pixel_tests.cpp /Fe:bin\pixel_tests.exe && bin\pixel_tests.exe && cl /nologo /std:c++20 /EHsc /O2 tests\flow_handoff.cpp /Fe:bin\flow_handoff.exe && bin\flow_handoff.exe')
        if ($LASTEXITCODE -ne 0) { throw "Compile or tests failed: $LASTEXITCODE" }
      } finally { Pop-Location }
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -LiteralPath fg\bin\FG.exe,fg\bin\fg.vert.spv,fg\bin\fg.frag.spv,fg\README.md -DestinationPath artifacts\FG-V15-Clean-v16-CUDA-Vulkan-Reflex-Windows-x64.zip -Force
      Copy-Item source.zip artifacts\FG-V15-Clean-v16-CUDA-Vulkan-Reflex-Source.zip
test: off
artifacts:
  - path: artifacts\FG-V15-Clean-v16-CUDA-Vulkan-Reflex-Windows-x64.zip
    name: FG-Windows-x64
  - path: artifacts\FG-V15-Clean-v16-CUDA-Vulkan-Reflex-Source.zip
    name: FG-Source
