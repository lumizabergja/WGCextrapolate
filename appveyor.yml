version: '1.0.{build}'
image: Visual Studio 2022
platform: x64
configuration: Release
branches:
  only:
    - fg-nvpresent-probe
clone_depth: 1
build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      & .\Fetch-NVAPI.ps1
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
      $vcvars = Join-Path $vs.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
      & cmd.exe /d /s /c ('call "' + $vcvars + '" && cl /nologo /std:c++17 /O2 /MT /EHsc /I nvapi-sdk probe\nvpresent_probe.cpp nvapi-sdk\nvapi64.lib /Fe:probe\FG-NvPresent-Probe.exe /link d3d11.lib dxgi.lib user32.lib gdi32.lib')
      if ($LASTEXITCODE -ne 0) { throw "Probe compilation failed: $LASTEXITCODE" }
      New-Item -ItemType Directory -Force artifacts | Out-Null
      Compress-Archive -Path 'probe/FG-NvPresent-Probe.exe','probe/Run-Probe.ps1','probe/Run-Probe.cmd','probe/README.txt' -DestinationPath 'artifacts/FG-NvPresent-Probe-Windows-x64.zip' -Force
      Compress-Archive -Path 'probe/nvpresent_probe.cpp','probe/Run-Probe.ps1','probe/Run-Probe.cmd','probe/README.txt','Fetch-NVAPI.ps1','appveyor.yml' -DestinationPath 'artifacts/FG-NvPresent-Probe-Source.zip' -Force
test: off
artifacts:
  - path: artifacts\*.zip
